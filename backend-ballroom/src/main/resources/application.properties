spring.application.name=ballroom
server.port=${PORT:8082}

# Online these come from Render's settings; on your laptop the defaults after ":" are used
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/secret_ballroom}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

server.error.include-message=always

ballroom.pepper=${BALLROOM_PEPPER:dev-only-change-me}
ballroom.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5180}